name: Nightly collect
on:
  schedule:
    - cron: "0 9 * * *"   # 5am Eastern / 2am Pacific
  workflow_dispatch: {}    # "Run workflow" button for a manual refresh
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Collect listings
        run: python -u collector/collect.py
      - name: Commit if changed
        run: |
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Listings $(date -u +%F)"
          git push
