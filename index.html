<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.anthropic.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Summer 2027 search</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='2' y='2' width='12' height='12' rx='2' fill='%2317694F'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8ECEA; --surface:#F6F8F7; --raised:#FFFFFF; --ink:#14201B; --muted:#5A6863; --rule:#C9D2CE;
  --accent:#17694F; --accent-soft:#D3E7DE; --amber:#9A5B0C; --amber-soft:#F3E3C8; --red:#A63A2B; --red-soft:#F3D9D4;
  --swe:#2D5B8C; --hw:#6E5A8E;
  --r-sm:4px; --r-md:8px;
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:var(--bg);
  font-size:15px; line-height:1.45; font-variant-numeric:tabular-nums;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121815; --surface:#18201C; --raised:#1E2823; --ink:#E3EAE6; --muted:#93A29B; --rule:#2E3A34;
  --accent:#4DB38C; --accent-soft:#1F3B30; --amber:#E0A04A; --amber-soft:#3A2D18; --red:#E07A6A; --red-soft:#3D221E;
  --swe:#7FA8D6; --hw:#B4A0D6;}}
*{box-sizing:border-box}
body{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.top{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--rule);background:var(--surface)}
.top h1{margin:0;font-size:19px;font-weight:700;font-stretch:87.5%;letter-spacing:-.01em}
.top .meta{color:var(--muted);font-size:13px;margin-right:auto}
.top .meta button{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px}
.btn{border:1px solid var(--rule);background:var(--raised);border-radius:var(--r-sm);padding:6px 12px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:3px 8px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}

.goals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--rule);border-bottom:1px solid var(--rule)}
.goal{min-width:0;background:var(--surface);padding:14px 24px}
.goal .num{font-size:30px;font-weight:700;font-stretch:75%;line-height:1}
.goal .num small{font-size:16px;color:var(--muted);font-weight:500}
.goal .lbl{color:var(--muted);font-size:13px;margin-top:4px}
.dies{display:grid;grid-template-columns:repeat(auto-fill,10px);gap:3px;margin:10px 0 2px;max-width:290px}
.die{width:10px;height:10px;border-radius:2px;border:1px solid var(--rule);background:var(--raised)}
.die.on{background:var(--accent);border-color:var(--accent)}
.goal.warn .num{color:var(--amber)}

nav.tabs{display:flex;gap:4px;padding:10px 24px 0;border-bottom:1px solid var(--rule)}
nav.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-weight:500}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding:20px 24px 60px}

.board{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(320px,1fr);gap:24px;align-items:start}
.panel{overflow-x:auto;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-md)}
.panel > header{flex-wrap:wrap;display:flex;align-items:baseline;gap:10px;padding:12px 16px;border-bottom:1px solid var(--rule)}
.panel > header h2{margin:0;font-size:16px;font-weight:650;font-stretch:87.5%}
.panel > header .count{color:var(--muted);font-size:13px;margin-right:auto}
.empty{padding:28px 16px;color:var(--muted)}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;color:var(--muted);font-size:13px;padding:8px 12px;border-bottom:1px solid var(--rule);white-space:nowrap}
th[data-sort]{cursor:pointer}
td{padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--raised)}
.co{font-weight:600}
.sub{color:var(--muted);font-size:13px}
.status-select{border:1px solid var(--rule);border-radius:var(--r-sm);background:var(--raised);padding:2px 4px;font-size:13px}

.lane{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.lane.sales{background:var(--accent)} .lane.swe{background:var(--swe)} .lane.hw{background:var(--hw)}
.chip{display:inline-block;font-size:12px;padding:1px 7px;border-radius:10px;margin:2px 4px 0 0;background:var(--bg);color:var(--muted);border:1px solid var(--rule)}
.chip.flag{background:var(--red-soft);color:var(--red);border-color:transparent}
.chip.good{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.due{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.chip.new{background:var(--accent);color:#fff;border-color:transparent}
.tier{font-size:12px;font-weight:600;color:var(--muted);margin-left:6px}

.filters{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;border-bottom:1px solid var(--rule)}
.filters input[type=search]{flex:1 1 140px;min-width:120px;border:1px solid var(--rule);border-radius:var(--r-sm);padding:5px 8px;background:var(--raised)}
.toggle{border:1px solid var(--rule);background:var(--raised);border-radius:14px;padding:3px 10px;font-size:13px;cursor:pointer}
.toggle[aria-pressed=true]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.feed{list-style:none;margin:0;padding:0;max-height:calc(100vh - 290px);overflow:auto}
.feed.wide{max-height:none}
.feed li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:10px 16px;border-bottom:1px solid var(--rule);cursor:pointer}
.feed li:hover{background:var(--raised)}
.feed .t{font-weight:500}
.feed .add{align-self:center}
.more{display:block;margin:12px auto}

.drawer-bg{position:fixed;inset:0;background:rgba(10,20,15,.35);opacity:0;pointer-events:none;transition:opacity .15s}
.drawer-bg.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--surface);border-left:1px solid var(--rule);
  transform:translateX(100%);transition:transform .18s ease-out;overflow:auto;padding:22px 26px 60px;z-index:5}
.drawer.open{transform:none}
.drawer h2{margin:0 0 2px;padding-right:70px;font-size:22px;font-weight:700;font-stretch:87.5%;line-height:1.2}
.drawer h3{font-size:15px;font-weight:650;margin:22px 0 8px}
.drawer .close{position:absolute;top:14px;right:16px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 12px;align-items:center}
.kv label{color:var(--muted);font-size:14px}
.kv input,.kv select,.kv textarea,.field{width:100%;border:1px solid var(--rule);border-radius:var(--r-sm);background:var(--raised);padding:6px 8px}
textarea{resize:vertical}
.jd{white-space:pre-wrap;font-size:14px;color:var(--muted);max-height:320px;overflow:auto;border:1px solid var(--rule);border-radius:var(--r-sm);padding:10px;background:var(--raised)}
.match{border:1px solid var(--rule);border-radius:var(--r-md);padding:14px;background:var(--raised)}
.match .pct{display:flex;gap:28px;margin-bottom:8px}
.match .pct div{font-size:28px;font-weight:700;font-stretch:75%}
.match .pct span{display:block;font-size:13px;font-weight:400;color:var(--muted);font-stretch:100%}
.match ul{margin:6px 0 0;padding-left:18px}
.match li{margin-bottom:6px}
.match .flagline{margin:0 0 6px;font-size:13px}
.reqs{overflow-x:auto;margin:8px 0}
.reqs table{font-size:13px}
.reqs th,.reqs td{padding:6px 6px}
.reqs .ev{color:var(--muted);font-style:italic}
.st{white-space:nowrap;font-weight:600}
.st.met{color:var(--accent)}.st.partial{color:var(--amber)}.st.missing{color:var(--red)}
.mk{display:inline-block;font-size:11px;padding:0 5px;border-radius:8px;margin-left:4px;background:var(--amber-soft);color:var(--amber);vertical-align:1px}
.mk.bad{background:var(--red-soft);color:var(--red)}
.err{color:var(--red);font-size:14px}
.spinner{display:inline-block;width:12px;height:12px;margin-right:7px;vertical-align:-1px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;opacity:.85;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{display:none}}
.save-status{display:inline-flex;align-items:center;gap:5px;font-size:14px}
.save-status svg{width:15px;height:15px;flex:none}
.save-status.ok{color:var(--accent)}.save-status.bad{color:var(--red)}.save-status.dirty{color:var(--amber);font-weight:600}
.save-status.mini{margin-left:6px;vertical-align:middle}.save-status.mini svg{width:14px;height:14px}
.top .save-status{font-size:13px}
.jd-src{font-size:12px;color:var(--muted);margin:0 0 6px;font-weight:600;letter-spacing:.02em}
.saved-at{margin:-8px 0 0}
.note{color:var(--muted);font-size:13px}
.hist{font-size:13px;color:var(--muted);margin:0;padding-left:18px}
.src-bad{color:var(--red)}
.nowrap{white-space:nowrap}
.src{display:flex;align-items:center;gap:6px;font-weight:500;white-space:nowrap}.src svg{width:14px;height:14px;flex:none}
.banner{padding:10px 24px;background:var(--amber-soft);color:var(--amber);border-bottom:1px solid var(--rule);font-size:14px}
.banner:empty{display:none}
.changes{border:1px solid var(--amber);border-radius:var(--r-md);padding:12px 14px;background:var(--amber-soft);margin:14px 0}
.changes h3{margin:0 0 6px}
.changes ul{margin:0 0 8px;padding-left:18px}
.diff{font-size:13px;max-height:260px;overflow:auto;border:1px solid var(--rule);border-radius:var(--r-sm);padding:8px 10px;background:var(--raised);margin:6px 0}
.diff p{margin:0 0 4px}
.diff .del{color:var(--red);text-decoration:line-through}.diff .add{color:var(--accent)}
.diff .del::before{content:"Removed: ";font-weight:600;text-decoration:none;display:inline-block}.diff .add::before{content:"Added: ";font-weight:600}

@media (max-width:900px){.board{grid-template-columns:1fr}.goals{grid-template-columns:1fr 1fr}.feed{max-height:none}.top{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="top">
  <h1>Summer 2027 search</h1>
  <div class="meta" id="meta">Loading listings</div>
  <span class="save-status" id="hdrMsg" role="status" aria-live="polite"></span>
  <button class="btn" id="exportBtn">Back up</button>
  <button class="btn" id="settingsBtn">Settings</button>
</div>
<div class="banner" id="banner" role="alert"></div>
<section class="goals" id="goals"></section>
<nav class="tabs" role="tablist" id="tabs">
  <button role="tab" data-tab="board" aria-selected="true">Board</button>
  <button role="tab" data-tab="openings">All openings</button>
  <button role="tab" data-tab="companies">Companies</button>
  <button role="tab" data-tab="contacts">Contacts</button>
</nav>
<main id="main"></main>
<div class="drawer-bg" id="drawerBg"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<input type="file" id="importFile" accept="application/json" hidden>

<script>
"use strict";
/* ---------- state ---------- */
const KEY = "s27dash.v1";
const STATUSES = ["Saved","Applied","OA","Interview","Offer","Rejected","Withdrawn"];
const ACTIVE = ["Applied","OA","Interview"];
const LANES = {sales:"Sales / FAE", swe:"Software / firmware", hw:"Hardware"};
const DEFAULT_PLANNED = `In progress, NOT finished (as of Oct 2026). Planned by Dec 2026:
- STM32 bare-metal C from the reference manual: GPIO, SysTick, timer interrupts, EXTI
- UART driver: printf over serial, interrupt RX with ring buffer
- UART bootloader: flash erase/write, jump to app (vector table, MSP, VTOR), linker script, CRC32 check
- SPI flash key-value store on W25Q64 surviving power cycles
- pytest + pySerial automated test harness, GitHub Actions CI
- Logic analyzer captures of UART/SPI frames
Winter break: Raspberry Pi CM4 PCIe/NVMe lab (lspci, config space, smartctl) and a 2-3 page application note.`;
const SEEDS = [
  {company:"Texas Instruments", title:"Sales Engineering Intern", location:"Santa Clara, CA", lane:"sales",
   url:"https://edbz.fa.us2.oraclecloud.com/hcmUI/CandidateExperience/en/sites/CX/job/25017890", notes:"Job 25017890. Keyword ATS: mirror JD vocabulary."},
  {company:"Astera Labs", title:"Sales Engineer Intern", location:"", lane:"sales", find:"sales engineer", notes:"Early Career NA 2027. Warm contact."},
  {company:"Astera Labs", title:"Field Applications Engineer Intern", location:"", lane:"sales", find:"field applications", notes:"Early Career NA 2027."},
  {company:"Western Digital", title:"Summer 2027 intern (firmware track)", location:"", lane:"swe", deadline:"2026-10-20", notes:"Two umbrella reqs (SWE + HW), firmware track in both. Apply to both."},
  {company:"IBM", title:"Technical Sales Engineer Intern", location:"", lane:"sales", notes:"Entry-Level Sales Program 2027. Also a Co-Op version."},
];
const blank = () => ({items:{}, hidden:{}, contacts:[], companyNotes:{}, checked:{}, analyses:{}, jds:{}, jdsAt:{}, snaps:{}, lastVisit:null, seeded:false,
  settings:{apiKey:"", model:"claude-haiku-4-5-20251001", profile:"Purdue sophomore, BS Integrated Business & Engineering (CODO to Computer Engineering in progress), graduating May 2029, US citizen, targets FAE / sales engineering first.",
    resume:"", planned:DEFAULT_PLANNED, followDays:14,
    goals:{p1:15, p1By:"2026-10-15", all:40, allBy:"2026-11-30"}}});
let S = load();
let L = {listings:[], generated_at:null}, SRC = {sources:[]}, CO = [];
let prevVisit = S.lastVisit;
const ui = {tab:"board", feed:{q:"", lanes:new Set(["sales"]), bay:false, tier:false, clean:false, fresh:false, coop:"all", limit:60},
  co:{q:"", open:false, manual:false}, sortItems:"urgency"};

function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s) return normalize(s); }catch(e){} return blank(); }
/* Fill defaults and coerce types. Runs on stored data and on restored backups, which can contain anything. */
function normalize(s){
  const b = blank(), num = (v, d, max) => Math.min(max, Math.max(0, Math.round(Number(v)) || d));
  const o = {...b, ...s, settings:{...b.settings, ...s.settings, goals:{...b.settings.goals, ...(s.settings||{}).goals}}};
  for(const k of ["items","hidden","companyNotes","checked","analyses","jds","jdsAt","snaps"]) if(!o[k] || typeof o[k] !== "object" || Array.isArray(o[k])) o[k] = {};
  for(const [k, v] of Object.entries(o.snaps)) if(!v || typeof v !== "object" || !Array.isArray(v.flags) || !Array.isArray(v.tags)) delete o.snaps[k];
  if(!Array.isArray(o.contacts)) o.contacts = [];
  const st = o.settings, g = st.goals;
  for(const k of ["apiKey","model","profile","resume","planned"]) if(typeof st[k] !== "string") st[k] = b.settings[k];
  if(typeof st.savedAt !== "string") delete st.savedAt;
  st.followDays = Math.max(3, num(st.followDays, 14, 365));
  g.p1 = num(g.p1, 15, 200) || 15; g.all = num(g.all, 40, 200) || 40;
  for(const a of Object.values(o.analyses)){
    if(!a || typeof a !== "object") continue;
    a.current = num(a.current, 0, 100); a.projected = num(a.projected, 0, 100);
    for(const k of ["strengths","gaps","keywords"]) if(!Array.isArray(a[k])) a[k] = [];
    if(a.requirements !== undefined && !Array.isArray(a.requirements)) delete a.requirements;  // shows as old scoring
    if(a.requirements) a.requirements = a.requirements.filter(r => r && typeof r === "object");
  }
  return o;
}
function persist(){ localStorage.setItem(KEY, JSON.stringify(S)); }
function save(){ try{ persist(); }catch(e){ alert("Could not save to browser storage: " + e.message); } }
/* Short, safe description of a storage failure (never echoes stored data). */
function storageError(e){
  if(e && (e.name === "QuotaExceededError" || e.name === "NS_ERROR_DOM_QUOTA_REACHED" || e.code === 22)) return "storage full";
  if(e && e.name === "SecurityError") return "browser storage is blocked";
  return "couldn't write to browser storage";
}
function savedAgo(iso, prefix = "Last saved ", never = "Not saved yet"){
  const t = iso ? new Date(iso) : null;
  if(!t || isNaN(t)) return never;
  const s = (Date.now() - t) / 1000;
  if(s < 60) return prefix + "just now";
  if(s < 3600) return `${prefix}${Math.floor(s / 60)} min ago`;
  if(s < 86400) return `${prefix}${Math.floor(s / 3600)} h ago`;
  return prefix + t.toLocaleString(undefined, {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
}

/* ---------- action feedback: one pattern for every button ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));
const nowIso = () => new Date().toISOString();
class UserError extends Error {}  // message shown as-is (no "Save failed:" prefix)
function feedback(el, cls, text){
  if(!el) return;
  el.className = "save-status" + (el.classList.contains("mini") ? " mini" : "") + (cls ? " " + cls : "");
  el.innerHTML = (cls === "ok" ? ICON_CHECK : cls === "bad" ? ICON_X : "") + esc(text || "");
}
/* Reads storage back and compares one slice of it (pick) with what is in memory. */
function storedMatches(pick){
  let saved;
  try{ const raw = localStorage.getItem(KEY); if(raw === null) return "nothing was stored"; saved = JSON.parse(raw); }
  catch(e){ return "couldn't read it back"; }
  return JSON.stringify(pick(saved) ?? null) === JSON.stringify(pick(S) ?? null) ? null : "stored data doesn't match";
}
/* Spinner on btn (at least 400 ms) while fn runs, then verify, then ✓ / ✗ in opts.out.
   opts: {busy, ok, fail (prefix for errors), verify() -> null | reason, out (element or selector, looked up at the end
   because fn may re-render), fade (ms to clear the ✓), min}. fn receives busy(text) for progress and may return the ✓ text. */
async function runAction(btn, fn, opts = {}){
  const t0 = performance.now(), label = btn.innerHTML;
  const busy = text => { if(btn.isConnected) btn.innerHTML = `<span class="spinner" aria-hidden="true"></span>${esc(text)}`; };
  const outEl = () => typeof opts.out === "string" ? $(opts.out) : opts.out;
  btn.disabled = true; busy(opts.busy || "Saving…"); feedback(outEl(), "", "");
  let err = null, res;
  try{
    res = await fn(busy);
    if(opts.verify) err = opts.verify(res);
  }catch(e){
    err = e instanceof UserError ? e : e instanceof DOMException ? storageError(e) : (e && e.message) || "something went wrong";
  }
  await sleep(Math.max(0, (opts.min ?? 400) - (performance.now() - t0)));
  if(btn.isConnected){ btn.disabled = false; btn.innerHTML = label; }
  const out = outEl();
  if(err) feedback(out, "bad", err instanceof UserError ? err.message : (opts.fail ?? "Save failed: ") + err);
  else{
    feedback(out, "ok", typeof res === "string" ? res : opts.ok || "Saved");
    if(opts.fade) setTimeout(() => { if(out && out.classList.contains("ok")) feedback(out, "", ""); }, opts.fade);
  }
  return !err;
}
/* "Unsaved changes" (amber) and a refreshing "Last saved ..." line for a form in the open drawer. */
function trackForm(fields, statusEl, showAt){
  const read = () => fields.map(f => f.value);
  let base = read();
  const t = {
    read,
    isDirty: () => read().some((v, k) => v !== base[k]),
    refresh(){ if(t.isDirty()) feedback(statusEl, "dirty", "Unsaved changes"); else if(statusEl.classList.contains("dirty")) feedback(statusEl, "", ""); },
    saved(snap = read()){ base = snap; t.refresh(); showAt(); },
  };
  for(const f of fields){ f.addEventListener("input", t.refresh); f.addEventListener("change", t.refresh); }
  showAt();
  const timer = setInterval(showAt, 30000);
  drawerCleanup.push(() => clearInterval(timer)); drawerForms.push(t);
  return t;
}
function applyStatus(i, s){
  if(i.status === s) return;
  i.status = s; i.lastActivity = today(); (i.history ||= []).push({s, d:today()});
  if(s === "Applied" && !i.appliedOn) i.appliedOn = today();
}
const ICON_CHECK = `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const ICON_X = `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>`;

/* ---------- helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(u||"") ? u : "";
// Your local date. toISOString() is UTC, which is already tomorrow on a US evening and made deadlines look passed early.
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const days = (a, b=today()) => Math.round((new Date(b) - new Date(a)) / 864e5);
const addDays = (d, n) => { const x = new Date(d + "T00:00:00Z"); x.setUTCDate(x.getUTCDate()+n); return x.toISOString().slice(0,10); };  // UTC math: no DST shift
const fmt = d => d ? new Date(d + "T12:00").toLocaleDateString(undefined,{month:"short", day:"numeric"}) : "";
const norm = s => (s||"").toLowerCase().replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim();
const uid = () => Math.random().toString(36).slice(2,10);
const coByName = n => CO.find(c => c.name === n);
const tierOf = n => (coByName(n)||{}).tier || "";
const listingById = id => L.listings.find(l => l.id === id);
const itemFor = lid => Object.values(S.items).find(i => i.lid === lid);

/* ---------- data load ---------- */
async function boot(){
  try{
    const [a,b,c] = await Promise.all(["data/listings.json","data/sources.json","config/companies.json"].map(u => fetch(u + "?t=" + Date.now()).then(r => { if(!r.ok) throw new Error(u + " " + r.status); return r.json(); })));
    L = a; SRC = b; CO = c;
  }catch(e){
    $("#meta").textContent = "Listings did not load. Open this page from GitHub Pages (or a local server), not as a file.";
  }
  if(!S.seeded){
    for(const s of SEEDS){ const id = uid(); S.items[id] = {id, ...s, status:"Saved", added:today(), lastActivity:today(), history:[{s:"Saved", d:today()}]}; }
    S.seeded = true;
  }
  for(const it of Object.values(S.items)) autoLink(it);  // attach saved roles to live listings once the feed has them
  if(L.listings.length){ relinkMoved(); markClosedItems(); syncSnaps(); pruneStorage(); }  // only against a feed that actually loaded
  S.lastVisit = today(); save();
  renderMeta(); renderGoals(); render();
}

/* ---------- cleanup ---------- */
/* The nightly run marks a listing closed after it misses 2 runs and drops it 30 days later, so a saved role
   records the close itself (closedOn) and keeps showing "Posting closed" after the listing is gone. */
function markClosedItems(){
  for(const i of Object.values(S.items)){
    if(!i.lid) continue;
    const l = listingById(i.lid);
    if(l && l.status === "open") delete i.closedOn;  // reposted
    else if(!i.closedOn) i.closedOn = (l && l.closed_on) || today();
  }
}
/* Due date: the one you set wins, else the one the posting states (read nightly from its text). */
function dueOf(i){ const l = i.lid && listingById(i.lid); return i.deadline || (l && l.deadline) || ""; }
// Saved but never applied to, and the posting closed or the deadline passed
const isStale = i => i.status === "Saved" && !!(i.closedOn || (dueOf(i) && dueOf(i) < today()));
const staleWhy = i => i.closedOn ? `Posting closed ${fmt(i.closedOn)}` : `Deadline passed ${fmt(dueOf(i))}`;
/* Drop browser data for postings that are gone and not saved: hidden marks, Claude matches, pasted descriptions, snapshots. */
function pruneStorage(){
  const keep = new Set(L.listings.map(l => l.id));
  for(const i of Object.values(S.items)){ keep.add(i.id); if(i.lid) keep.add(i.lid); }
  for(const store of [S.hidden, S.analyses, S.jds, S.jdsAt]) for(const k of Object.keys(store)) if(!keep.has(k)) delete store[k];
  for(const k of Object.keys(S.snaps)) if(!S.items[k]) delete S.snaps[k];
}
/* A title or location edit gives a posting a new listing id. The nightly run records the old id in prev_ids; for
   anything it missed, the same posting link (or job number) finds it. Either way the saved role follows the posting
   instead of showing "Posting closed", and its snapshot shows what was renamed. */
function relinkMoved(){
  for(const i of Object.values(S.items)){
    if(!i.lid) continue;
    const l = listingById(i.lid);
    if(l && l.status === "open") continue;
    let n = L.listings.find(x => (x.prev_ids || []).includes(i.lid));
    if(!n && i.url){ const u = listingForUrl(i.url, i.company); if(u && u.id !== i.lid && u.status === "open") n = u; }
    if(n && !itemFor(n.id)) moveItem(i, n);
  }
}
function moveItem(i, n){
  for(const store of [S.analyses, S.jds, S.jdsAt, S.hidden]) if(store[i.lid] !== undefined && store[n.id] === undefined){ store[n.id] = store[i.lid]; delete store[i.lid]; }
  Object.assign(i, {lid:n.id, title:n.title, location:n.location, url:n.url}); delete i.closedOn;
}
/* Closed posting, and an open one at the same company with the same title: likely reposted under a new job number.
   Not followed automatically (it can be a different opening); the role offers to switch. */
function repostOf(i){
  if(!i.closedOn && !(i.lid && (listingById(i.lid) || {}).status === "closed")) return null;
  return L.listings.find(x => x.status === "open" && !x.excluded && x.company === i.company && norm(x.title) === norm(i.title) && !itemFor(x.id)) || null;
}

/* ---------- posting changes since you saved ---------- */
/* Each saved role keeps a snapshot of its posting from when you saved it (or last marked it reviewed), in this browser.
   changesOf() lists what differs now: title, location, term, stated deadline, pay, eligibility, the description text. */
function snapOf(l){
  return {h:l.desc_hash || "", k:l.hash_kind || "", desc:l.desc || "", title:l.title, location:l.location || "", term:l.term,
    deadline:l.deadline || "", pay:l.pay || "", flags:[...l.flags], tags:[...l.tags], excluded:l.excluded || "", at:today()};
}
function syncSnaps(){
  for(const i of Object.values(S.items)){
    const l = i.lid && listingById(i.lid); if(!l) continue;
    const s = S.snaps[i.id];
    if(!s){ S.snaps[i.id] = {...snapOf(l), base:true}; continue; }  // saved before tracking existed: starts now
    // the first full read of the text, or a switch to another source of it, is a new baseline, not an edit
    if(l.desc_hash && (!s.h || s.k !== (l.hash_kind || ""))) Object.assign(s, {h:l.desc_hash, k:l.hash_kind || "", desc:l.desc || ""});
  }
}
function changesOf(i){
  const l = i.lid && listingById(i.lid), s = S.snaps[i.id]; if(!l || !s) return [];
  const out = [], was = (a, b) => `${a || "not listed"} → ${b || "not listed"}`;
  if(l.title !== s.title) out.push(`Title: “${s.title}” → “${l.title}”`);
  if((l.location || "") !== s.location) out.push(`Location: ${was(s.location, l.location)}`);
  if(l.term !== s.term) out.push(`Term: ${was(s.term, l.term)}`);
  if((l.deadline || "") !== s.deadline) out.push(!l.deadline ? `Deadline no longer stated (was ${fmt(s.deadline)})` : s.deadline ? `Deadline moved: ${fmt(s.deadline)} → ${fmt(l.deadline)}` : `Deadline now stated: ${fmt(l.deadline)}`);
  if((l.pay || "") !== s.pay) out.push(`Pay: ${was(s.pay, l.pay)}`);
  const plus = (a, b) => a.filter(x => !b.includes(x));
  if(plus(l.flags, s.flags).length) out.push(`New eligibility flag: ${plus(l.flags, s.flags).join(", ")}`);
  if(plus(s.flags, l.flags).length) out.push(`Flag cleared: ${plus(s.flags, l.flags).join(", ")}`);
  if(plus(s.tags, l.tags).length) out.push(`No longer says: ${plus(s.tags, l.tags).join(", ")}`);
  if(plus(l.tags, s.tags).length) out.push(`Now says: ${plus(l.tags, s.tags).join(", ")}`);
  if((l.excluded || "") !== s.excluded && l.excluded) out.push(`Posting now reads: ${l.excluded}`);
  if(l.desc_hash && s.h && l.desc_hash === s.h) return out;
  if(l.desc_hash && s.h && s.k === (l.hash_kind || "")) out.push(`Description edited${l.desc_changed_on ? " " + fmt(l.desc_changed_on) : ""}`);
  return out;
}
/* Line diff of the stored description then and now (whitespace and punctuation ignored). */
function lineDiff(a, b){
  const A = a.split("\n").map(x => x.trim()).filter(Boolean), B = b.split("\n").map(x => x.trim()).filter(Boolean);
  const nA = A.map(normText), nB = B.map(normText), n = A.length, m = B.length;
  const T = Array.from({length:n + 1}, () => new Uint16Array(m + 1));
  for(let x = n - 1; x >= 0; x--) for(let y = m - 1; y >= 0; y--) T[x][y] = nA[x] === nB[y] ? T[x+1][y+1] + 1 : Math.max(T[x+1][y], T[x][y+1]);
  const out = []; let x = 0, y = 0;
  while(x < n || y < m){
    if(x < n && y < m && nA[x] === nB[y]){ x++; y++; }
    else if(y < m && (x >= n || T[x][y+1] >= T[x+1][y])) out.push({t:"add", s:B[y++]});
    else out.push({t:"del", s:A[x++]});
  }
  return out;
}
function openCleanup(){
  const stale = Object.values(S.items).filter(isStale);
  if(!openDrawer(`<h2>Clean up closed roles</h2>
   <p class="note">Saved roles you haven't applied to, where the posting closed or the deadline passed. Roles you applied to stay on the board.</p>
   ${stale.length ? `<ul class="hist">${stale.map(i => `<li><label><input type="checkbox" data-rm="${esc(i.id)}" checked> <strong>${esc(i.company)}</strong>, ${esc(i.title)}
     <span class="sub">${esc(staleWhy(i))}</span></label></li>`).join("")}</ul>` : `<p class="note">Nothing to clean up.</p>`}
   <div class="actions"><button class="btn primary" id="rmStale"${stale.length ? "" : " disabled"}>Remove selected</button><span class="save-status" id="cMsg" role="status" aria-live="polite"></span></div>`)) return;
  $("#rmStale").onclick = async () => {
    const gone = [...$("#drawer").querySelectorAll("[data-rm]:checked")].map(x => S.items[x.dataset.rm]);
    if(!gone.length) return;
    const ok = await runAction($("#rmStale"), () => { gone.forEach(i => delete S.items[i.id]); persist(); },
      {busy:"Removing…", ok:`Removed ${gone.length}`, out:"#cMsg", verify: () => storedMatches(s => gone.map(i => s.items[i.id]))});
    if(!ok){ gone.forEach(i => S.items[i.id] = i); return; }
    pruneStorage(); save();
    renderGoals(); renderKeepScroll(); await sleep(700); forceCloseDrawer();
  };
}

/* ---------- linking saved roles to scraped listings ---------- */
// "https://X.com/a/job/123/?src=li" -> "x.com/a/job/123"
const urlKey = u => { try{ const x = new URL(u); return (x.host + x.pathname).toLowerCase().replace(/\/+$/, ""); }catch(e){ return ""; } };
// Job ID at the end of the URL: the last run of 5+ digits in the last path segment ("/job/25017890", "/Sales-Intern_JR-0012345", "/78488-en_US")
const urlJobId = u => { const m = urlKey(u).split("/").pop().match(/\d{5,}/g); return m ? m[m.length - 1] : ""; };
let urlIndex = null;
function listingForUrl(u, company){
  if(!urlIndex){
    urlIndex = {byKey:new Map(), byId:new Map()};
    for(const l of L.listings){  // an open listing wins over a closed one with the same link (renamed postings)
      const k = urlKey(l.url), id = urlJobId(l.url), have = urlIndex.byKey.get(k);
      if(k && (!have || (have.status !== "open" && l.status === "open"))) urlIndex.byKey.set(k, l);
      if(id) (urlIndex.byId.get(id) || urlIndex.byId.set(id, []).get(id)).push(l);
    }
  }
  const exact = urlIndex.byKey.get(urlKey(u));
  if(exact) return exact;
  const id = urlJobId(u);  // same job ID on another URL form: only trust it within the same company
  const same = id ? (urlIndex.byId.get(id) || []).filter(l => norm(l.company) === norm(company)) : [];
  return same.find(l => l.status === "open") || same[0] || null;
}
function autoLink(it){
  if(it.lid) return false;
  let l = null;
  if(it.find) l = L.listings.find(l => l.company === it.company && norm(l.title).includes(it.find) && l.status === "open");
  if(!l && it.url) l = listingForUrl(it.url, it.company);
  if(!l || itemFor(l.id)) return false;  // never link two saved roles to one listing
  for(const store of [S.analyses, S.jds]) if(store[it.id] && !store[l.id]){ store[l.id] = store[it.id]; delete store[it.id]; }  // keep match / pasted JD
  it.lid = l.id; it.url = it.url || l.url; it.title = l.title; it.location = l.location;
  S.snaps[it.id] = snapOf(l);
  return true;
}

/* The nightly run can fail or be paused (GitHub turns off scheduled runs after 60 days without a commit). Old data
   would still look current, so past 36 hours a banner says so. */
function renderMeta(){
  if(!L.generated_at){ $("#banner").textContent = "Listings didn't load, so posting status, deadlines and descriptions below can't be checked. Reload, or open the page from GitHub Pages."; return; }
  const bad = SRC.sources.filter(s => !s.ok);
  const hrs = Math.round((Date.now() - new Date(L.generated_at)) / 36e5);
  $("#banner").textContent = hrs > 36 ? `Listings were last updated ${Math.round(hrs / 24)} days ago (${new Date(L.generated_at).toLocaleString(undefined, {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"})}). The nightly run hasn't finished since, so closed postings, deadlines and description changes may be missing. Check the repo's Actions tab.` : "";
  $("#meta").innerHTML = `Updated ${hrs < 1 ? "under an hour" : hrs + "h"} ago, ${esc(L.count)} open roles. ` +
    `<button id="srcBtn">${bad.length ? `${bad.length} feed${bad.length>1?"s":""} failing` : `All ${SRC.sources.length} feeds working`}</button>`;
  const b = $("#srcBtn"); if(b) b.onclick = openSources;
}

/* ---------- goals ---------- */
function applied(){ return Object.values(S.items).filter(i => i.status !== "Saved"); }
function dueSoon(){ return Object.values(S.items).filter(i => { const d = dueOf(i); return d && i.status === "Saved" && days(today(), d) <= 7 && days(today(), d) >= 0; }); }
function followUps(){
  const n = S.settings.followDays;
  const its = Object.values(S.items).filter(i => ACTIVE.includes(i.status) && days(i.lastActivity) >= n);
  const cs = S.contacts.filter(c => c.next && c.next <= today());
  return {its, cs, total: its.length + cs.length};
}
function renderGoals(){
  const g = S.settings.goals, ap = applied();
  const p1 = ap.filter(i => tierOf(i.company) === "P1").length;
  const dies = (n, on) => `<div class="dies" aria-hidden="true">${Array.from({length:n}, (_,k) => `<span class="die${k<on?" on":""}"></span>`).join("")}</div>`;
  const behind = (cnt, goal, by) => cnt < goal && days(today(), by) <= 10;
  const fu = followUps(), ds = dueSoon();
  $("#goals").innerHTML = `
   <div class="goal${behind(p1,g.p1,g.p1By)?" warn":""}"><div class="num">${p1}<small> / ${esc(g.p1)}</small></div>${dies(g.p1,p1)}<div class="lbl">P1 applications by ${fmt(g.p1By)} (${Math.max(0,days(today(),g.p1By))} days left)</div></div>
   <div class="goal${behind(ap.length,g.all,g.allBy)?" warn":""}"><div class="num">${ap.length}<small> / ${esc(g.all)}</small></div>${dies(g.all,ap.length)}<div class="lbl">All applications by ${fmt(g.allBy)}</div></div>
   <div class="goal"><div class="num">${ds.length}</div><div class="lbl">Saved roles due in the next 7 days</div></div>
   <div class="goal"><div class="num">${fu.total}</div><div class="lbl">Follow-ups due (${esc(S.settings.followDays)}+ days quiet)</div></div>`;
}

/* ---------- render router ---------- */
/* Re-render without jumping the openings list back to the top (e.g. after saving a role). */
function renderKeepScroll(){
  const top = ($("#main .feed") || {}).scrollTop || 0;
  render();
  const f = $("#main .feed"); if(f) f.scrollTop = top;
}
function render(){
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === ui.tab));
  ({board:renderBoard, openings:renderOpenings, companies:renderCompanies, contacts:renderContacts})[ui.tab]();
}
$("#tabs").onclick = e => { const t = e.target.dataset.tab; if(t){ ui.tab = t; ui.feed.limit = 60; render(); } };

/* ---------- board ---------- */
function urgency(i){
  if(i.status === "Saved") return dueOf(i) ? days(today(), dueOf(i)) : 400;
  if(ACTIVE.includes(i.status)) return 500 - days(i.lastActivity);
  return 900;
}
function renderBoard(){
  const items = Object.values(S.items).sort((a,b) => ui.sortItems === "match"
      ? ((analysisFor(b)||{}).current||0) - ((analysisFor(a)||{}).current||0) : urgency(a) - urgency(b));
  const fu = followUps();
  $("#main").innerHTML = `<div class="board">
   <section class="panel">
    <header><h2>Apply later</h2><span class="count">${items.length} roles, ${applied().length} applied</span>
      <select class="status-select" id="sortItems" aria-label="Sort"><option value="urgency">Most urgent first</option><option value="match"${ui.sortItems==="match"?" selected":""}>Best match first</option></select>
      <button class="btn small" id="matchAll">Match all with Claude</button><span class="save-status" id="matchAllMsg" role="status" aria-live="polite"></span>
      ${items.some(isStale) ? `<button class="btn small" id="cleanUp">Clean up ${items.filter(isStale).length} closed</button>` : ""}</header>
    ${fu.cs.length ? `<div class="filters">${fu.cs.map(c => `<span class="chip due" data-contact="${esc(c.id)}" style="cursor:pointer">Follow up: ${esc(c.name)} (${esc(c.company)})</span>`).join("")}</div>` : ""}
    ${items.length ? `<table><thead><tr><th>Role</th><th>Status</th><th>Due</th><th>Match</th></tr></thead><tbody>
     ${items.map(itemRow).join("")}</tbody></table>` : `<div class="empty">Nothing saved yet. Add roles from the openings on the right.</div>`}
   </section>
   ${feedPanel(false)}
  </div>`;
  $("#sortItems").onchange = e => { ui.sortItems = e.target.value; render(); };
  $("#matchAll").onclick = matchAll;
  if($("#cleanUp")) $("#cleanUp").onclick = openCleanup;
  $("#main").querySelectorAll("tr.row").forEach(tr => tr.onclick = e => { if(e.target.tagName !== "SELECT") openItem(tr.dataset.id); });
  $("#main").querySelectorAll("select[data-status]").forEach(s => s.onchange = e => setStatus(s.dataset.status, e.target.value));
  $("#main").querySelectorAll("[data-contact]").forEach(c => c.onclick = () => openContact(c.dataset.contact));
  wireFeed();
}
function itemRow(i){
  const a = analysisFor(i), l = i.lid ? listingById(i.lid) : null;
  const quiet = ACTIVE.includes(i.status) ? days(i.lastActivity) : null;
  const flags = (l ? l.flags : []).map(f => `<span class="chip flag">${esc(f)}</span>`).join("");
  const closed = (l && l.status === "closed") || i.closedOn ? `<span class="chip flag">Posting closed</span>${repostOf(i) ? `<span class="chip due" title="An open posting at ${esc(i.company)} has the same title. Open the role to switch to it.">Reposted?</span>` : ""}` : "";
  const ch = changesOf(i);
  const status = (ch.length ? `<span class="chip due" title="${esc(ch.join("\n"))}">Changed since saved (${ch.length})</span>` : "")
    + (l && l.page_gone && l.status === "open" ? `<span class="chip flag" title="Its page said 'not found' on ${esc(fmt(l.page_gone))}, but the site's search still lists it. Checked again nightly.">Page gone, may be closed</span>` : "")
    + (l && l.excluded ? `<span class="chip flag">Now: ${esc(l.excluded)}</span>` : "") + trackLine(i, l);
  const due = dueCell(i, l);
  return `<tr class="row" data-id="${esc(i.id)}"><td><span class="lane ${esc(i.lane)}"></span><span class="co">${esc(i.company)}</span><span class="tier">${esc(tierOf(i.company))}</span>
     <div class="sub">${esc(i.title)}</div>${flags}${closed}${status}</td>
    <td><select class="status-select" data-status="${esc(i.id)}" aria-label="Status">${STATUSES.map(s => `<option${s===i.status?" selected":""}>${s}</option>`).join("")}</select>
     ${quiet !== null ? `<div class="sub">${quiet}d since update</div>` : ""}</td>
    <td>${due}${quiet !== null && quiet >= S.settings.followDays ? `<span class="chip due">Quiet ${quiet}d</span>` : ""}</td>
    <td>${a ? `<strong>${esc(a.current)}%</strong>${matchMarkers(a)}<div class="sub">${!freshMatch(a) ? "Old scoring: match again" : staleMatch(a, l) ? "Posting changed: match again" : esc(a.projected) + "% projected"}</div>` : `<span class="sub">Not matched</span>`}</td></tr>`;
}
/* Every date says where it came from: you, the posting's own text, or the company's history (Companies tab). */
function dueCell(i, l){
  const chip = (d, cls = "") => { const n = days(today(), d); return `<span class="chip ${n <= 7 && n >= 0 ? "due" : cls}">${fmt(d)}${n < 0 ? " (passed)" : ""}</span>`; };
  const pd = l && l.deadline;
  let out = "";
  if(i.deadline){
    out = `${chip(i.deadline)}<div class="sub">You set it</div>`;
    if(pd && pd !== i.deadline) out += `<span class="chip flag" title="${esc(l.deadline_quote || "")}">Posting says ${esc(fmt(pd))}</span>`;
  }else if(pd) out = `${chip(pd)}<div class="sub" title="${esc(l.deadline_quote || "")}">Stated in posting</div>`;
  const co = i.status === "Saved" && coByName(i.company), cd = co && companyDeadline(co);  // the company's stated or last-year date, as a hint
  if(cd && cd.main !== "Rolling") out += `<div class="sub" title="From the Companies tab">${!out && cd.soon ? `<span class="chip due">${esc(cd.main)}</span>` : esc(cd.main)} ${esc(cd.sub.toLowerCase())}</div>`;
  return out;
}
/* How current the nightly run's view of this posting is. Quiet when it was read in the last 3 days. */
function trackLine(i, l){
  if(!i.lid) return `<div class="sub">Not tracked: check the posting yourself${i.verifiedOn ? ` (you did ${esc(fmt(i.verifiedOn))})` : ""}</div>`;
  if(!l || l.status !== "open") return "";
  if(!l.checked_on) return `<div class="sub">Text not read by the nightly run yet</div>`;
  return days(l.checked_on) > 3 ? `<div class="sub">Text last read ${esc(fmt(l.checked_on))}</div>` : "";
}
/* The match was made on an older version of the description. */
function staleMatch(a, l){
  if(!a || !l || !l.desc_hash) return false;
  return a.h ? a.h !== l.desc_hash : !!(l.desc_changed_on && a.at && a.at < l.desc_changed_on);
}
/* Board dropdown: save, read back, then a small ✓ (or ✗ with the reason on hover) next to the select. */
function setStatus(id, s){
  const i = S.items[id]; if(!i || i.status === s) return;
  let err = null;
  try{ applyStatus(i, s); i.savedAt = nowIso(); persist(); err = storedMatches(st => st.items[id]); }
  catch(e){ err = storageError(e); }
  renderGoals(); render();
  const sel = $(`select[data-status="${CSS.escape(id)}"]`); if(!sel) return;
  const m = document.createElement("span");
  m.className = "save-status mini"; m.setAttribute("role", "status");
  m.setAttribute("aria-label", err ? "Status not saved: " + err : "Status saved");
  if(err) m.title = "Save failed: " + err;
  sel.after(m); feedback(m, err ? "bad" : "ok", "");
  if(!err) setTimeout(() => m.remove(), 2500);
}

/* ---------- feed ---------- */
function feedList(){
  const f = ui.feed, q = norm(f.q), saved = new Set(Object.values(S.items).map(i => i.lid));  // saved roles live in Apply later
  return L.listings.filter(l => l.status === "open" && !l.excluded && !S.hidden[l.id] && !saved.has(l.id) && f.lanes.has(l.lane)

/* ---------- quick keyword fit (free, no Claude) ---------- */
const TERMS = ["c","c++","python","matlab","verilog","systemverilog","vhdl","fpga","asic","rtl","embedded","firmware","microcontroller","mcu","arm","risc-v","rtos","linux","uart","spi","i2c","pcie","cxl","ethernet","usb","nvme","ddr","signal integrity","oscilloscope","logic analyzer","lab equipment","test","validation","verification","debug","jtag","pcb","schematic","analog","power","rf","customer","presentation","communication","technical support","application notes","sales","crm","salesforce","excel","git","ci","pytest","scripting","data analysis","spice","ltspice","cadence","digital logic","computer architecture","semiconductor","circuits","teamwork","leadership"];
function termsIn(text){
  const t = " " + (text||"").toLowerCase().replace(/[^a-z0-9+#\- ]+/g," ") + " ";
  return new Set(TERMS.filter(k => t.includes(" " + k + " ")));
}
function quickFit(jd){
  if(!jd || jd.length < 200) return null;
  const want = termsIn(jd); if(want.size < 3) return null;
  const have = termsIn(S.settings.resume + " " + S.settings.planned);
  return {hit:[...want].filter(k => have.has(k)).length, of:want.size, missing:[...want].filter(k => !have.has(k))};
}

/* ---------- Claude match (on click, uses your API key) ---------- */
/* Claude extracts and assesses requirements; scoreMatch() checks the quotes and computes the %. */
const SYS = `You assess how well one specific student fits one internship posting. Be honest and calibrated; never inflate. You do not score: code computes the score from your requirement list.
Requirements: 4-15 items, deduplicated, only things the posting actually asks for. Boilerplate it lists (e.g. "team player") is fine; never invent items. One item per distinct ask.
- kind: "preferred" if the posting calls it preferred, nice to have, a plus, ideally, bonus, or desired; every other listed qualification is "required".
- gate: true only for eligibility rules (degree level or field, graduation year, citizenship, class standing, GPA floor, work authorization, enrollment). Skills and experience are never gates.
- now: status using only STUDENT and RESUME (finished work). Judge depth and scope, not keywords. met = the resume shows the student doing this specific thing at roughly the level asked; partial = related but weaker (coursework, an adjacent tool or domain, smaller scope, or the skill is only named); missing = not shown. When torn between two statuses, choose the lower. Asks for experience or proficiency ("experience with", "proficient in", "N years") are met only when the resume shows the skill used in real work or a substantial project, never by a skills list alone. Soft skills (communication, teamwork) need a concrete example, not a self-description.
- now_source: where now_evidence comes from: "work" (a job, internship, or research position), "project" (personal, team, club, or class project), "coursework", "skills" (only named in a skills list, summary, or the STUDENT profile), or "" when missing.
- now_evidence: an exact verbatim quote (5-25 words, copied character for character) from STUDENT or RESUME that supports the status, or "" when missing. Code checks every quote; a paraphrase counts as missing.
- planned: status if the PLANNED WORK is finished, judged just as strictly. Never lower than now.
- planned_source: same values as now_source, or "planned" when the evidence is in PLANNED WORK.
- planned_evidence: exact verbatim quote from STUDENT, RESUME, or PLANNED WORK, or "" when missing.
Code then lowers every status not backed by "work" one step (met -> partial -> missing), because a student's grasp of project, class, and listed skills is usually shallower than the resume reads. Assess honestly anyway; don't pre-lower.
eligible: "no" if a gate is clearly failed, "unclear" if a gate can't be confirmed, otherwise "yes" or "likely".
verdict: intern postings ask for more than they require, so base it on gates and required items, not on how many items are met.
Reply with ONLY a JSON object, no prose, no code fences:
{"requirements":[{"text":"short restatement of the ask","kind":"required|preferred","gate":false,"now":"met|partial|missing","now_source":"work|project|coursework|skills|","now_evidence":"","planned":"met|partial|missing","planned_source":"work|project|coursework|skills|planned|","planned_evidence":""}],"eligible":"yes|likely|unclear|no","eligibility_note":"one sentence","verdict":"one sentence: apply now, apply after X, or skip, and why","strengths":["max 3, short"],"gaps":[{"gap":"short","fix":"one concrete action, preferably a specific item from the planned work, with what to show on the resume"}],"keywords":["max 8 posting terms the student can truthfully mirror"]}`;
const STATUS_VAL = {met:1, partial:0.5, missing:0};
const SCORING = 2;  // bump when scoring changes; older matches show "Old scoring: match again"
const freshMatch = a => !!(a && a.requirements && a.v === SCORING);
/* Conservative by design: only paid work / research counts at face value. Projects, coursework, listed skills,
   and anything only in the planned work drop one step (met -> partial -> missing). Gates are never lowered. */
const LOWER = {met:"partial", partial:"missing", missing:"missing"};
const SOURCES = ["work", "project", "coursework", "skills", "planned"];
const normText = s => String(s || "").toLowerCase().replace(/[^a-z0-9+#]+/g, " ").trim();
/* Quote check: normalized evidence must appear in the normalized source, on word boundaries. */
const quoted = (ev, src) => { const q = normText(ev); return q.length > 0 && src.includes(" " + q + " "); };
/* Verify quotes, dedupe, and compute the score in code. Gates never count toward the %. */
function scoreMatch(a, st){
  const now = " " + normText(st.profile + "\n" + st.resume) + " ";
  const later = " " + normText(st.profile + "\n" + st.resume + "\n" + st.planned) + " ";
  const seen = new Set(), reqs = [];
  for(const r of Array.isArray(a.requirements) ? a.requirements : []){
    if(!r || typeof r !== "object" || typeof r.text !== "string" || !r.text.trim()) continue;
    const k = normText(r.text); if(seen.has(k)) continue; seen.add(k);
    const q = {text:r.text.trim().slice(0, 200), kind:r.kind === "preferred" ? "preferred" : "required", gate:r.gate === true};
    for(const [f, src] of [["now", now], ["planned", later]]){
      q[f] = STATUS_VAL[r[f]] !== undefined ? r[f] : "missing";
      q[f + "_evidence"] = typeof r[f + "_evidence"] === "string" ? r[f + "_evidence"].trim().slice(0, 400) : "";
      if(q[f] !== "missing" && !quoted(q[f + "_evidence"], src)){ q[f] = "missing"; q[f + "_unverified"] = true; }
      q[f + "_source"] = SOURCES.includes(r[f + "_source"]) ? r[f + "_source"] : (q[f] === "missing" ? "" : "skills");  // unlabeled = weakest
      if(!q.gate && q[f] !== "missing" && q[f + "_source"] !== "work"){ q[f + "_claude"] = q[f]; q[f] = LOWER[q[f]]; }
    }
    if(STATUS_VAL[q.planned] < STATUS_VAL[q.now]){ q.planned = q.now; q.planned_evidence = q.now_evidence; delete q.planned_unverified; }
    reqs.push(q);
  }
  a.requirements = reqs.slice(0, 15);
  const scored = a.requirements.filter(r => !r.gate);
  const pct = f => { let got = 0, of = 0;
    for(const r of scored){ const w = r.kind === "required" ? 2 : 1; of += w; got += w * STATUS_VAL[r[f]]; }
    return of ? Math.round(100 * got / of) : 0; };
  a.current = pct("now"); a.projected = Math.max(a.current, pct("planned")); a.v = SCORING;
  a.lowConfidence = scored.length < 4;
  a.gateFails = a.requirements.filter(r => r.gate && r.now === "missing").map(r => r.text);
  if(!["yes","likely","unclear","no"].includes(a.eligible)) a.eligible = "unclear";
  if(a.gateFails.length && a.eligible !== "no") a.eligible = "unclear";
  return a;
}
/* "Required 5/7 met, preferred 2/4" for one status field. */
function reqTally(a, f){
  const c = kind => { const rs = a.requirements.filter(r => !r.gate && r.kind === kind); return `${rs.filter(r => r[f] === "met").length}/${rs.length}`; };
  return `Required ${c("required")} met, preferred ${c("preferred")}`;
}
function matchMarkers(a){
  if(!freshMatch(a)) return "";
  return (a.gateFails && a.gateFails.length || a.eligible === "no" ? `<span class="mk bad" title="Eligibility: ${esc(a.eligible)}">gate</span>` : "")
    + (a.lowConfidence ? `<span class="mk" title="Fewer than 4 scored requirements">low conf.</span>` : "");
}
function analysisFor(i){ return S.analyses[i.lid || i.id]; }
function jdFor(key){ const l = listingById(key); return (l && l.desc) || S.jds[key] || ""; }
class RetryableReply extends Error {}  // cut off or unparseable: worth one automatic retry
/* Sonnet 5.5 thinks by default and thinking counts toward max_tokens, so the first try keeps it
   at low effort and the retry turns it off (between_tools is Sonnet 5.5 only) so the JSON always fits.
   Sonnet 5.5 rejects a non-default temperature, so temperature 0 applies to the other models. */
function matchBody(model, prompt, retry){
  const b = {model, max_tokens:6000, system:SYS, messages:[{role:"user", content:prompt}]};
  if(model.startsWith("claude-sonnet-5-5"))
    Object.assign(b, retry ? {thinking:{type:"between_tools"}} : {thinking:{type:"adaptive"}, output_config:{effort:"low"}});
  else b.temperature = 0;
  return b;
}
/* First balanced {...} in text that parses, skipping braces inside strings. */
function firstJsonObject(s){
  for(let i = s.indexOf("{"); i >= 0; i = s.indexOf("{", i + 1)){
    let depth = 0, inStr = false, escp = false;
    for(let j = i; j < s.length; j++){
      const c = s[j];
      if(inStr){ if(escp) escp = false; else if(c === "\\") escp = true; else if(c === '"') inStr = false; }
      else if(c === '"') inStr = true;
      else if(c === "{") depth++;
      else if(c === "}" && --depth === 0){ try{ return JSON.parse(s.slice(i, j + 1)); }catch{ break; } }
    }
  }
  return null;
}
async function matchRequest(st, prompt, retry){
  const r = await fetch("https://api.anthropic.com/v1/messages", {method:"POST",
    headers:{"content-type":"application/json","x-api-key":st.apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify(matchBody(st.model, prompt, retry))});
  if(!r.ok){ const t = await r.text(); throw new Error(`Anthropic API ${r.status}: ${t.slice(0,180)}`); }
  const d = await r.json();
  if(d.stop_reason === "refusal") throw new Error("Claude declined" + (d.stop_details?.explanation ? `: ${d.stop_details.explanation}` : "."));
  const a = firstJsonObject((d.content || []).filter(b => b.type === "text").map(b => b.text).join(""));
  if(a && Array.isArray(a.requirements)) return a;
  if(a) throw new RetryableReply("Claude's reply had no requirements list. Try again.");
  if(d.stop_reason === "max_tokens") throw new RetryableReply("Reply cut off (max_tokens). Try again.");
  throw new RetryableReply("Invalid JSON in Claude's reply. Try again.");
}
async function claudeMatch(key, company, title, location){
  const st = S.settings;
  if(!st.apiKey) throw new Error("Add your Anthropic API key in Settings first.");
  if(!st.resume.trim()) throw new Error("Paste your resume text in Settings first.");
  const jd = jdFor(key);
  if(jd.length < 150) throw new Error("No job description yet. Paste it into the box below, then match.");
  const prompt = `STUDENT\n${st.profile}\n\nRESUME\n${st.resume}\n\nPLANNED WORK (not done yet)\n${st.planned}\n\nPOSTING\nCompany: ${company}\nTitle: ${title}\nLocation: ${location}\n\n${jd.slice(0,6000)}`;
  let a;
  try{ a = await matchRequest(st, prompt, false); }
  catch(e){ if(!(e instanceof RetryableReply)) throw e; a = await matchRequest(st, prompt, true); }
  a.at = today(); a.model = st.model; a.h = (listingById(key) || {}).desc_hash || "";  // which version of the text was matched
  scoreMatch(a, st);
  for(const k of ["strengths","gaps","keywords"]) if(!Array.isArray(a[k])) a[k] = [];
  S.analyses[key] = a; save(); return a;
}
async function matchAll(){
  const todo = Object.values(S.items).filter(i => (!freshMatch(analysisFor(i)) || staleMatch(analysisFor(i), i.lid && listingById(i.lid)))
    && !["Rejected","Withdrawn","Offer"].includes(i.status));
  if(!todo.length){ feedback($("#matchAllMsg"), "ok", "All matched"); return; }
  await runAction($("#matchAll"), async busy => {
    let done = 0, noJd = 0, failed = 0, stop = null;
    try{
      for(const [n, i] of todo.entries()){
        busy(`Matching ${n + 1} of ${todo.length}`);
        try{ await claudeMatch(i.lid || i.id, i.company, i.title, i.location); done++; }
        catch(e){
          if(/^No job description/.test(e.message)) noJd++;
          else if(/API key|resume|API 4/.test(e.message)){ stop = e.message; break; }
          else failed++;
        }
      }
    }finally{ render(); }  // show whatever finished, even after a stop
    const summary = [`Matched ${done}`, noJd && `${noJd} need a description`, failed && `${failed} failed`].filter(Boolean).join(", ");
    if(stop) throw new UserError(`${stop} (${summary})`);
    return summary;
  }, {busy:"Matching…", out:"#matchAllMsg"});
}

let drawerCleanup = [], drawerForms = [], flash = null;
function resetDrawerHooks(){ const c = drawerCleanup; drawerCleanup = []; drawerForms = []; c.forEach(f => f()); }
function drawerCanClose(){ return !drawerForms.some(f => f.isDirty()) || confirm("You have unsaved changes. Close without saving?"); }
function reopenWith(sel, text, open){ flash = {sel, text}; open(); flash = null; }
function openDrawer(html){
  if(!drawerCanClose()) return false;
  resetDrawerHooks();
  const d = $("#drawer"); d.innerHTML = `<button class="btn small close" id="closeD">Close</button>` + html;
  d.classList.add("open"); d.setAttribute("aria-hidden","false"); $("#drawerBg").classList.add("open");
  $("#closeD").onclick = () => closeDrawer(); $("#closeD").focus();
  if(flash) setTimeout((f => () => feedback($(f.sel), "ok", f.text))(flash), 0);  // after the caller wires the drawer
  return true;
}
function closeDrawer(){ if(drawerCanClose()) forceCloseDrawer(); }
function forceCloseDrawer(){ resetDrawerHooks(); $("#drawer").classList.remove("open"); $("#drawer").setAttribute("aria-hidden","true"); $("#drawerBg").classList.remove("open"); }
$("#drawerBg").onclick = closeDrawer;
document.addEventListener("keydown", e => { if(e.key === "Escape") closeDrawer(); });

function listingHeader(l){
  const c = coByName(l.company);
  return `<h2>${esc(l.title)}</h2><p class="sub">${esc(l.company)}${c ? `, ${esc(c.tier)}, ${esc(c.segment)}` : ", not on your company list"}</p>
   <p>${esc(l.location || "Location not listed")}<br><span class="sub">${l.term === "Unspecified" ? "Term not stated" : esc(l.term)}${l.coop ? ", co-op" : ""}. Lane: ${esc(LANES[l.lane])}. Source: ${esc(l.sources.join(", "))}.</span></p>
   ${l.flags.map(x => `<span class="chip flag">${esc(x)}</span>`).join("")}${l.tags.map(x => `<span class="chip good">${esc(x)}</span>`).join("")}
   <p class="sub">${postingDates(l)}</p>
   ${l.deadline ? `<p class="note"><strong>Deadline ${esc(fmt(l.deadline))}</strong> (${esc(dueIn(l.deadline))}), stated in the posting: “${esc(l.deadline_quote || "")}”</p>` : ""}
   ${l.pay ? `<p class="note">Pay in the posting: ${esc(l.pay)}</p>` : ""}
   ${l.was ? `<p class="note">Renamed ${esc(fmt(l.was.on))}: was “${esc(l.was.title)}”${l.was.location !== l.location ? `, ${esc(l.was.location || "no location")}` : ""}.</p>` : ""}
   ${l.page_gone && l.status === "open" ? `<p class="err">The posting's page said "not found" on ${esc(fmt(l.page_gone))}, but the site's search still lists it. It may be closing; check before you spend time on it.</p>` : ""}
   ${l.excluded ? `<p class="err">The posting now reads: ${esc(l.excluded)}. It's hidden from Openings.</p>` : ""}`;
}
/* Each date with what it means: when the role appeared, when the site's search last listed it, when its text was last read. */
function postingDates(l){
  const read = l.checked_on ? `Text read ${fmt(l.checked_on)}${l.desc_changed_on ? `, last edited ${fmt(l.desc_changed_on)}` : ", no edits seen"}` : "Text not read by the nightly run yet (blocked site or not reached)";
  const seen = l.status === "open" ? `Listed in the site's search ${l.last_seen >= (L.generated_at || "").slice(0,10) ? "on the last run" : "until " + fmt(l.last_seen)}` : `Closed ${fmt(l.closed_on)}`;
  return `First seen ${fmt(l.first_seen)}. ${seen}. ${read}.`;
}
function openListing(lid){
  const l = listingById(lid); if(!l) return;
  const saved = itemFor(lid);
  openDrawer(`${listingHeader(l)}
   <div class="actions">${safeUrl(l.url) ? `<a class="btn" href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener">Open posting</a>` : ""}
    ${saved ? `<button class="btn" id="goItem">Open in apply later</button>` : `<button class="btn primary" id="saveL">Save to apply later</button>`}
    <button class="btn" id="hideL">Hide this role</button><span class="save-status" id="lMsg" role="status" aria-live="polite"></span></div>
   ${matchBlock(lid, l.company, l.title, l.location)}${jdBlock(lid)}`);
  if($("#saveL")) $("#saveL").onclick = async () => {
    let id = null;
    const ok = await runAction($("#saveL"), () => { id = addListingItem(lid); persist(); },
      {verify: () => storedMatches(s => s.items[id]), out:"#lMsg", ok:"Saved to apply later"});
    if(ok){ renderGoals(); renderKeepScroll(); reopenWith("#lMsg", "Saved to apply later", () => openListing(lid)); }
  };
  if($("#goItem")) $("#goItem").onclick = () => openItem(saved.id);
  $("#hideL").onclick = async () => {
    const ok = await runAction($("#hideL"), () => { S.hidden[lid] = true; persist(); },
      {busy:"Hiding…", ok:"Hidden", verify: () => storedMatches(s => s.hidden[lid]), out:"#lMsg"});
    if(ok){ await sleep(700); closeDrawer(); renderKeepScroll(); }
  };
  wireMatch(lid, l.company, l.title, l.location, () => openListing(lid)); wireJd(lid);
}
