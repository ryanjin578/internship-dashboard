function changesBlock(i){
  const l = i.lid && listingById(i.lid), s = S.snaps[i.id], ch = changesOf(i), rp = repostOf(i);
  let h = "";
  if(rp) h += `<div class="changes"><h3>Reposted?</h3>
    <p class="note">This posting closed, and ${esc(i.company)} has an open one with the same title (first seen ${esc(fmt(rp.first_seen))}, ${esc(rp.location || "location not listed")}). It may be the same role under a new job number, or a different opening.</p>
    <div class="actions"><button class="btn" id="openRp">Look at it</button><button class="btn primary" id="switchRp">Switch this role to it</button><span class="save-status" id="rpMsg" role="status" aria-live="polite"></span></div></div>`;
  if(ch.length){
    const diff = l && s.desc !== (l.desc || "") ? lineDiff(s.desc, l.desc || "") : [];
    h += `<div class="changes"><h3>Changed since you ${s.base ? "started tracking it" : "saved it"} (${esc(fmt(s.at))})</h3>
     <ul>${ch.map(c => `<li>${esc(c)}</li>`).join("")}</ul>
     ${diff.length ? `<div class="diff">${diff.slice(0, 60).map(d => `<p class="${d.t}">${esc(d.s)}</p>`).join("")}${diff.length > 60 ? `<p class="sub">${diff.length - 60} more changed lines</p>` : ""}</div>`
       : ch.some(c => c.startsWith("Description")) ? `<p class="note">The edit is past the part of the description stored here. Open the posting to read it.</p>` : ""}
     <div class="actions"><button class="btn" id="reviewed">Mark reviewed</button><span class="save-status" id="rvMsg" role="status" aria-live="polite"></span></div>
     <p class="sub">After you mark it reviewed, only later changes show here.</p></div>`;
  }
  return h;
}
function wireChanges(i){
  if($("#reviewed")) $("#reviewed").onclick = async () => {
    const prev = S.snaps[i.id];
    const ok = await runAction($("#reviewed"), () => { S.snaps[i.id] = snapOf(listingById(i.lid)); persist(); },
      {verify: () => storedMatches(s => (s.snaps || {})[i.id]), ok:"Reviewed", out:"#rvMsg"});
    if(ok){ render(); reopenWith("#iMsg", "Marked reviewed", () => openItem(i.id)); } else S.snaps[i.id] = prev;
  };
  const rp = repostOf(i);
  if($("#openRp")) $("#openRp").onclick = () => openListing(rp.id);
  if($("#switchRp")) $("#switchRp").onclick = async () => {
    const before = JSON.stringify(S);
    const ok = await runAction($("#switchRp"), () => { moveItem(i, rp); persist(); },
      {verify: () => storedMatches(s => s.items[i.id]), ok:"Switched", out:"#rpMsg"});
    if(ok){ urlIndex = null; render(); reopenWith("#iMsg", "Switched to the new posting", () => openItem(i.id)); } else S = normalize(JSON.parse(before));
  };
}

/* Paste helper for "Add a role": pulls link, role, location, company and lane out of a pasted posting.
   Fills only fields that are empty or that it filled itself, so your own edits stick. */
const US_STATES = "AL AK AZ AR CA CO CT DE FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY DC".split(" ");
const LOC_RE = new RegExp(`\\b([A-Z][A-Za-z.' -]{1,30}),\\s*(${US_STATES.join("|")})\\b`);
function parsePosting(text){
  const out = {}, t = text.replace(/\r/g, "");
  const url = t.match(/https?:\/\/[^\s<>"']+/); if(url) out.url = url[0].replace(/[).,]+$/, "");
  const lines = t.split("\n").map(x => x.trim()).filter(x => x && !/^https?:/.test(x));
  const title = lines.find(x => x.length >= 6 && x.length <= 120 && /intern|co-?op|engineer|analyst|associate|student|developer|scientist|technician/i.test(x))
    || lines.find(x => x.length >= 6 && x.length <= 120);
  if(title) out.title = title.replace(/^(job title|title|position)\s*[:\-]\s*/i, "");
  const loc = t.match(LOC_RE) || t.match(/\b(Remote|Hybrid)\b/);
  if(loc) out.location = loc[0].trim();
  // whole-word match; the company named first wins (postings often mention customers or partners later)
  const low = " " + norm(t) + " ";
  const at = c => Math.min(...[c.name, ...(c.aliases||[])].map(n => norm(n)).filter(n => n.length > 2).map(n => { const k = low.indexOf(" " + n + " "); return k < 0 ? Infinity : k; }));
  const co = CO.map(c => [at(c), c]).filter(x => x[0] < Infinity).sort((x, y) => x[0] - y[0])[0];
  if(co) out.company = co[1].name;
  const tl = (out.title || "").toLowerCase();
  if(out.title) out.lane = /sales|application|field|customer|marketing|business|product/.test(tl) ? "sales"
    : /software|firmware|swe|developer|machine learning|data|devops|web/.test(tl) ? "swe" : "hw";
  return out;
}
function fillFromPaste(text){
  const got = parsePosting(text), filled = [];
  for(const [k, id] of [["company","fCo"],["title","fTi"],["location","fLo"],["url","fUrl"],["lane","fLane"]]){
    const el = $("#" + id); if(!got[k]) continue;
    if(el.dataset.auto === "1" || !el.value.trim() || (id === "fLane" && !el.dataset.user)){ el.value = got[k]; el.dataset.auto = "1"; filled.push(k); }
  }
  $("#fPasteMsg").textContent = !text.trim() ? "" : filled.length ? "Filled in: " + filled.join(", ") + ". Check them before adding." : "Couldn't find anything to fill. Type the fields in.";
}

/* ---------- companies ---------- */
/* Whether the nightly run reads this company's careers site. Icon + wording tell the states apart, not color. */
const ICON_DASH = `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 8h8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>`;
const ICON_CLOCK = `<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 5v3.2l2 1.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`;
function sourceState(name){
  const c = coByName(name);
  if(!c || !c.sources || !c.sources.length) return {key:"none", icon:ICON_DASH, txt:"Not read", sub:"Roles from GitHub lists only"};
  const ss = SRC.sources.filter(s => s.company === name);
  if(!ss.length) return {key:"new", icon:ICON_CLOCK, txt:"Added", sub:"First read on the next nightly run"};
  const bad = ss.filter(s => !s.ok).length;
  if(bad) return {key:"failing", icon:ICON_X, txt:"Read failed", sub:ss.length > 1 ? `${bad} of ${ss.length} feeds failed last run` : "Failed on the last run"};
  return {key:"ok", icon:ICON_CHECK, txt:"Read nightly", sub:`${ss.reduce((n, s) => n + (s.rows || 0), 0)} postings scanned last run`};
}
/* No working feed: the nightly run can't read this company's careers site, so you check it by hand. */
function needsManual(name){ const k = sourceState(name).key; return k === "none" || k === "failing"; }
function checkedLabel(name){ const d = S.checked[name]; return d ? "Checked " + (d === today() ? "today" : fmt(d)) : "Never checked"; }
function careersSearch(name){ return "https://www.google.com/search?q=" + encodeURIComponent(name + " careers internship"); }
/* Timing: last cycle's real posting dates (collector/history.py, from Simplify) beat the hand-written window. */
const mon = d => new Date(d + "T12:00").toLocaleDateString(undefined, {month:"short"});
const shortWindow = w => (w || "").replace(/\b20(\d\d)\b/g, "'$1").replace(/\s*-\s*/g, "–").replace(/;\s*/g, ", ");  // "Oct 2026 - Jan 2027" -> "Oct '26–Jan '27"
const dueIn = d => { const n = days(today(), d); return n === 0 ? "today" : n === 1 ? "tomorrow" : n > 0 ? `in ${n}d` : `${-n}d ago`; };
const nextYear = d => (Number(d.slice(0,4)) + 1) + d.slice(4);
function timingOf(c){
  const lc = c.last_cycle, tc = c.this_cycle;
  if(!lc) return {main: shortWindow(c.window) || "Unknown", sub: tc ? `Posting since ${fmt(tc.opened)}` : c.window ? "Your estimate" : "", why: ""};
  return {main: lc.closed && mon(lc.closed) !== mon(lc.opened) ? `${mon(lc.opened)}–${mon(lc.closed)}` : `From ${mon(lc.opened)}`,
    sub: tc ? `Posting since ${fmt(tc.opened)}` : `Last yr from ${fmt(lc.opened)}`,
    why: `${lc.term}: ${lc.postings} US intern postings on Simplify, first on ${fmt(lc.opened)}${lc.closed ? ", half closed by " + fmt(lc.closed) : ""}.`
      + (tc ? ` ${tc.term}: ${tc.postings} so far, first on ${fmt(tc.opened)}.` : "")};
}
/* Deadline: your saved role's deadline, else one the company stated, else when last year's postings closed. */
function deadlineOf(c){
  const mine = Object.values(S.items).filter(i => i.company === c.name && i.status === "Saved" && dueOf(i) && dueOf(i) >= today()).map(dueOf).sort()[0];
  if(mine) return {main: fmt(mine), sub: `Your saved role, ${dueIn(mine)}`, soon: days(today(), mine) <= 7};
  return companyDeadline(c);
}
/* The company's own date: one it stated, else when last year's postings closed (shifted to this year). */
function companyDeadline(c){
  if(c.deadline) return {main: fmt(c.deadline), sub: c.deadline < today() ? "Stated, passed" : `Stated, ${dueIn(c.deadline)}`, soon: c.deadline >= today() && days(today(), c.deadline) <= 7};
  if(c.last_cycle && c.last_cycle.closed){
    const d = nextYear(c.last_cycle.closed);
    return {main: "~" + fmt(d), sub: d < today() ? "Last yr's had closed by now" : "When last yr's closed", soon: d >= today() && days(today(), d) <= 14};
  }
  return {main: "Rolling", sub: "No date known", soon: false};
}
function renderCompanies(){
  const f = ui.co, q = norm(f.q);
  const openBy = {}, salesBy = {};
  L.listings.forEach(l => { if(l.status === "open" && !l.excluded){ openBy[l.company] = (openBy[l.company]||0) + 1; if(l.lane === "sales") salesBy[l.company] = (salesBy[l.company]||0) + 1; } });
  const rows = CO.filter(c => (!q || norm(c.name + " " + c.segment).includes(q)) && (!f.open || openBy[c.name]) && (!f.manual || needsManual(c.name)))
    .sort((a,b) => a.tier.localeCompare(b.tier) || (openBy[b.name]||0) - (openBy[a.name]||0) || a.name.localeCompare(b.name));
  $("#main").innerHTML = `<section class="panel"><header><h2>Companies</h2><span class="count">${rows.length} shown. Defense and national labs are excluded.</span></header>
   <div class="filters"><input type="search" id="coQ" placeholder="Search company or segment" value="${esc(f.q)}" aria-label="Search companies">
    <button class="toggle" id="coOpen" aria-pressed="${f.open}">Has open roles</button>
    <button class="toggle" id="coManual" aria-pressed="${f.manual}">Check by hand (${CO.filter(c => needsManual(c.name)).length})</button>
    <button class="btn small" id="coAdd">Add role</button></div>
   <table><thead><tr><th>Company</th><th>Tier</th><th>Open roles</th><th>Sales / FAE</th><th>Applied</th><th>Timing</th><th>Deadline</th><th>Careers site</th><th>Check by hand</th></tr></thead><tbody>
   ${rows.map(c => { const s = sourceState(c.name), t = timingOf(c), d = deadlineOf(c), ap = Object.values(S.items).filter(i => i.company === c.name && i.status !== "Saved").length;
     return `<tr class="row" data-co="${esc(c.name)}"><td><span class="co">${esc(c.name)}</span><div class="sub">${esc(c.segment)}${c.fit ? ", " + esc(c.fit) : ""}${c.sales_only ? ", sales roles only" : ""}</div></td>
      <td>${esc(c.tier)}</td><td>${openBy[c.name] || `<span class="sub">None posted</span>`}</td><td>${salesBy[c.name] || `<span class="sub">0</span>`}</td><td>${ap || ""}</td>
      <td title="${esc(t.why)}"><span class="nowrap">${esc(t.main)}</span><div class="sub">${esc(t.sub)}</div></td>
      <td><span class="nowrap">${d.soon ? `<span class="chip due">${esc(d.main)}</span>` : esc(d.main)}</span><div class="sub">${esc(d.sub)}</div></td>
      <td><span class="src">${s.icon}${s.txt}</span><div class="sub">${s.sub}</div></td>
      <td>${needsManual(c.name) ? `<span class="chip due">Check by hand</span><div class="sub">${checkedLabel(c.name)}</div>` : ""}</td></tr>`; }).join("")}
   </tbody></table></section>`;
  $("#coQ").oninput = e => { f.q = e.target.value; const p = e.target.selectionStart; renderCompanies(); const x = $("#coQ"); x.focus(); x.setSelectionRange(p,p); };
  $("#coOpen").onclick = () => { f.open = !f.open; renderCompanies(); };
  $("#coManual").onclick = () => { f.manual = !f.manual; renderCompanies(); };
  $("#coAdd").onclick = () => openItem(null);
  $("#main").querySelectorAll("tr[data-co]").forEach(tr => tr.onclick = () => openCompany(tr.dataset.co));
}
function openCompany(name){
  const c = coByName(name); if(!c) return;
  const roles = L.listings.filter(l => l.company === name && l.status === "open" && !l.excluded);
  const contacts = S.contacts.filter(x => x.company === name);
  const ss = SRC.sources.filter(s => s.company === name);
  openDrawer(`<h2>${esc(c.name)}</h2><p class="sub">${esc(c.tier)}, ${esc(c.segment)}${c.fit ? ", " + esc(c.fit) + " fit" : ""}</p>
   ${c.notes ? `<p>${esc(c.notes)}</p>` : ""}
   <p class="sub">Timing: ${esc(timingOf(c).main)}. ${esc(timingOf(c).why || (c.window ? "Your estimate: " + shortWindow(c.window) + "." : ""))}
    Deadline: ${esc(deadlineOf(c).main)} (${esc(deadlineOf(c).sub.toLowerCase())}).
    ${c.sales_only ? "Only sales / FAE roles are kept for this company. " : ""}${c.gpa_floor ? "GPA floor: " + esc(c.gpa_floor) + ". " : ""}${c.bay_site ? "Bay Area site: " + esc(c.bay_site) + "." : ""}</p>
   ${needsManual(name) ? `<h3>Check by hand</h3>
     <p class="note">The nightly run can't read this company's careers site. Look there yourself, then add any role you want to track.</p>
     <div class="actions"><a class="btn" href="${esc(careersSearch(name))}" target="_blank" rel="noopener">Find careers page</a>
      <button class="btn primary" id="coAddRole">Add a role</button><button class="btn" id="coChecked">Mark checked today</button>
      <span class="save-status" id="coMsg" role="status" aria-live="polite"></span></div>
     <p class="sub" id="coChk">${checkedLabel(name)}</p>` : ""}
   <h3>Your notes</h3><textarea class="field" id="coNote" rows="4">${esc(S.companyNotes[name]||"")}</textarea>
   <h3>Open roles (${roles.length})</h3>
   ${roles.length ? `<ul class="feed wide">${roles.map(l => feedRow(l, true)).join("")}</ul>` : `<p class="note">Nothing posted right now.</p>`}
   <h3>Contacts</h3>${contacts.length ? contacts.map(x => `<p><a href="#" data-ct="${esc(x.id)}">${esc(x.name)}</a> <span class="sub">${esc(x.title||"")}</span></p>`).join("") : `<p class="note">None yet.</p>`}
   <button class="btn small" id="addCt">Add contact here</button>
   <h3>Feeds</h3>${ss.length ? ss.map(s => `<p class="${s.ok ? "sub" : "src-bad"}">${esc(s.name)}: ${s.ok ? esc(s.rows) + " rows" : esc(s.error)}</p>`).join("") : `<p class="note">${c.sources && c.sources.length ? "Not run yet." : "No direct feed. Roles here come from the GitHub repos only. Ask Claude Code to add this company's careers site."}</p>`}`);
  $("#coNote").onchange = e => { S.companyNotes[name] = e.target.value; save(); };
  if($("#coAddRole")) $("#coAddRole").onclick = () => openItem(null, name);
  if($("#coChecked")) $("#coChecked").onclick = async () => {
    const prev = S.checked[name];
    const ok = await runAction($("#coChecked"), () => { S.checked[name] = today(); persist(); },
      {verify: () => storedMatches(s => (s.checked || {})[name]), ok:"Marked", out:"#coMsg"});
    if(ok){ $("#coChk").textContent = checkedLabel(name); renderKeepScroll(); }
    else if(prev) S.checked[name] = prev; else delete S.checked[name];
  };
  $("#addCt").onclick = () => openContact(null, name);
  $("#drawer").querySelectorAll("[data-ct]").forEach(a => a.onclick = e => { e.preventDefault(); openContact(a.dataset.ct); });
  $("#drawer").querySelectorAll(".feed li[data-lid]").forEach(li => li.onclick = e => { if(e.target.dataset.add){ saveListing(e.target.dataset.add); openCompany(name); } else openListing(li.dataset.lid); });
}

/* ---------- contacts ---------- */
function renderContacts(){
  const cs = [...S.contacts].sort((a,b) => (a.next||"9") .localeCompare(b.next||"9"));
  $("#main").innerHTML = `<section class="panel"><header><h2>Contacts</h2><span class="count">${cs.length} people</span><button class="btn small" id="addC">Add contact</button></header>
   ${cs.length ? `<table><thead><tr><th>Name</th><th>Company</th><th>Met at</th><th>Last touch</th><th>Next follow-up</th></tr></thead><tbody>
    ${cs.map(c => { const due = c.next && c.next <= today();
      return `<tr class="row" data-id="${esc(c.id)}"><td><span class="co">${esc(c.name)}</span><div class="sub">${esc(c.title||"")}</div></td><td>${esc(c.company)}</td>
       <td class="sub">${esc(c.met||"")}</td><td>${fmt(c.last)}</td><td>${c.next ? `<span class="chip ${due ? "due" : ""}">${fmt(c.next)}</span>` : ""}</td></tr>`; }).join("")}</tbody></table>`
    : `<div class="empty">No contacts yet. Add people from career fairs, info sessions, and LinkedIn so follow-ups don't slip.</div>`}</section>`;
  $("#addC").onclick = () => openContact(null);
  $("#main").querySelectorAll("tr.row").forEach(tr => tr.onclick = () => openContact(tr.dataset.id));
}
function openContact(id, company=""){
  const c = id ? S.contacts.find(x => x.id === id) : {id:uid(), name:"", title:"", company, met:"", email:"", linkedin:"", last:today(), next:"", notes:""};
  if(!c) return;
  openDrawer(`<h2>${id ? esc(c.name) : "Add contact"}</h2>
   <div class="kv">
    <label for="cN">Name</label><input id="cN" value="${esc(c.name)}">
    <label for="cT">Title</label><input id="cT" value="${esc(c.title)}">
    <label for="cC">Company</label><input id="cC" list="coList2" value="${esc(c.company)}"><datalist id="coList2">${CO.map(x => `<option value="${esc(x.name)}">`).join("")}</datalist>
    <label for="cM">Where you met</label><input id="cM" value="${esc(c.met)}" placeholder="e.g. Industrial Roundtable 9/15">
    <label for="cE">Email</label><input id="cE" value="${esc(c.email)}">
    <label for="cL">LinkedIn</label><input id="cL" value="${esc(c.linkedin)}">
    <label for="cLa">Last touch</label><input id="cLa" type="date" value="${esc(c.last)}">
    <label for="cNx">Next follow-up</label><input id="cNx" type="date" value="${esc(c.next)}">
    <label for="cNo">Notes</label><textarea id="cNo" rows="4">${esc(c.notes)}</textarea>
   </div>
   <p class="note">Leave next follow-up blank to set it ${esc(S.settings.followDays)} days after last touch.</p>
   <div class="actions"><button class="btn primary" id="cSave">${id ? "Save changes" : "Add contact"}</button>
    ${id ? `<button class="btn" id="cTouch">Contacted today</button><button class="btn" id="cDel">Delete</button>` : ""}<span class="save-status" id="cMsg" role="status" aria-live="polite"></span></div>
   <p class="note saved-at" id="cAt"></p>`);
  const form = trackForm(["cN","cT","cC","cM","cE","cL","cLa","cNx","cNo"].map(f => $("#" + f)), $("#cMsg"),
    () => { $("#cAt").textContent = savedAgo(c.savedAt, "Last saved ", id ? "" : "Not saved yet"); });
  const read = () => {
    const v = {name:$("#cN").value.trim(), title:$("#cT").value.trim(), company:$("#cC").value.trim(), met:$("#cM").value.trim(),
      email:$("#cE").value.trim(), linkedin:$("#cL").value.trim(), last:$("#cLa").value, next:$("#cNx").value || (($("#cLa").value) ? addDays($("#cLa").value, S.settings.followDays) : ""), notes:$("#cNo").value};
    if(!v.name) throw new UserError("Name is required.");
    Object.assign(c, v);
  };
  const saveContact = (btn, change, msg, busy) => runAction(btn, () => {
    read(); change();
    c.savedAt = nowIso(); if(!S.contacts.includes(c)) S.contacts.push(c);
    persist();
  }, {busy, ok:msg, out:"#cMsg", verify: () => storedMatches(s => (s.contacts || []).find(x => x.id === c.id))});
  $("#cSave").onclick = async () => {
    const msg = id ? "Saved" : "Added";
    if(await saveContact($("#cSave"), () => {}, msg, id ? "Saving…" : "Adding…")){ form.saved(); renderGoals(); render(); reopenWith("#cMsg", msg, () => openContact(c.id)); }
  };
  if($("#cTouch")) $("#cTouch").onclick = async () => {
    if(await saveContact($("#cTouch"), () => { c.last = today(); c.next = addDays(today(), S.settings.followDays); }, "Logged today's contact", "Saving…")){
      form.saved(); renderGoals(); render(); reopenWith("#cMsg", "Logged today's contact", () => openContact(c.id));
    }
  };
  if($("#cDel")) $("#cDel").onclick = async () => {
    if(!confirm("Delete this contact?")) return;
    const before = S.contacts;
    const ok = await runAction($("#cDel"), () => { S.contacts = S.contacts.filter(x => x !== c); persist(); },
      {busy:"Deleting…", ok:"Deleted", out:"#cMsg", verify: () => storedMatches(s => (s.contacts || []).find(x => x.id === c.id))});
    if(!ok){ S.contacts = before; return; }
    renderGoals(); render(); await sleep(700); forceCloseDrawer();
  };
}

/* ---------- feeds status ---------- */
function openSources(){
  const bad = SRC.sources.filter(s => !s.ok), good = SRC.sources.filter(s => s.ok);
  openDrawer(`<h2>Feed health</h2><p class="sub">Last run ${new Date(SRC.generated_at).toLocaleString()}. A failing feed doesn't close its roles; they stay until it works again.</p>
   <h3>Failing (${bad.length})</h3>${bad.map(s => `<p class="src-bad">${esc(s.name)}<br><span class="sub">${esc(s.error)}</span></p>`).join("") || `<p class="note">None.</p>`}
   <p class="note">To fix one, ask Claude Code: "the ${esc((bad[0]||{}).name || "X")} feed is failing, fix the adapter."</p>
   ${pagesHealth()}
   <h3>Working (${good.length})</h3>${good.map(s => `<p class="sub">${esc(s.name)}: ${esc(s.rows)} rows</p>`).join("")}`);
}
/* The nightly re-read of job pages (descriptions, deadlines, closings), and the sites where it's falling behind. */
function pagesHealth(){
  const p = SRC.pages; if(!p) return "";
  const list = o => Object.entries(o || {}).map(([h, v]) => `<p class="sub">${esc(h)}: ${esc(typeof v === "object" ? Object.entries(v).map(([k, n]) => `${n} ${k}`).join(", ") : v)}</p>`).join("");
  return `<h3>Job pages</h3><p class="note">Last run read ${esc(p.read)} postings in full, found ${esc(p.changed)} edited and ${esc(p.gone)} gone; ${esc(p.failed)} failed, ${esc(p.blocked)} skipped after a site blocked us, ${esc(p.skipped)} left for the next run.
    ${esc(p.unread_3d)} open postings weren't read in the last 3 days (blocked sites, or not reached yet).</p>
   ${Object.keys(p.problems || {}).length ? `<p class="sub"><strong>Sites with errors</strong></p>${list(p.problems)}` : ""}
   ${Object.keys(p.unread_3d_by_site || {}).length ? `<p class="sub"><strong>Not read in the last 3 days, by site</strong></p>${list(p.unread_3d_by_site)}` : ""}
   ${Object.keys(p.unreadable || {}).length ? `<p class="sub"><strong>Sites that can't be read</strong> (not tried; open or closed comes from the repos)</p>
    ${Object.entries(p.unreadable).map(([h, u]) => `<p class="sub">${esc(h)}: ${esc(u.open)} open. ${esc(u.why)}</p>`).join("")}` : ""}`;
}

/* ---------- settings, backup, calendar ---------- */
function openSettings(){
  const st = S.settings, g = st.goals;
  if(!openDrawer(`<h2>Settings</h2><p class="sub">Everything here stays in this browser only.</p>
   <div id="sForm">
   <h3>Claude matching</h3>
   <div class="kv"><label for="sKey">API key</label><input id="sKey" type="password" value="${esc(st.apiKey)}" placeholder="sk-ant-..." autocomplete="off">
    <label for="sModel">Model</label><select id="sModel">
     <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5 (cheapest)</option><option value="claude-sonnet-5-5">Claude Sonnet 5.5 (sharper, costs more)</option></select></div>
   <p class="note">Set a monthly spend limit in the Anthropic console. Each match sends your resume, plan, and the posting.</p>
   <h3>About you</h3><textarea class="field" id="sProfile" rows="3">${esc(st.profile)}</textarea>
   <h3>Resume text</h3><textarea class="field" id="sResume" rows="10" placeholder="Paste your resume as plain text">${esc(st.resume)}</textarea>
   <h3>Planned work (for projected match)</h3><textarea class="field" id="sPlanned" rows="8">${esc(st.planned)}</textarea>
   <h3>Goals and follow-ups</h3>
   <div class="kv"><label for="gP1">P1 applications</label><input id="gP1" type="number" min="1" value="${esc(g.p1)}">
    <label for="gP1By">by</label><input id="gP1By" type="date" value="${esc(g.p1By)}">
    <label for="gAll">All applications</label><input id="gAll" type="number" min="1" value="${esc(g.all)}">
    <label for="gAllBy">by</label><input id="gAllBy" type="date" value="${esc(g.allBy)}">
    <label for="sFu">Follow up after</label><input id="sFu" type="number" min="3" value="${esc(st.followDays)}"></div>
   </div>
   <div class="actions"><button class="btn primary" id="sSave">Save settings</button><span class="save-status" id="sMsg" role="status" aria-live="polite"></span></div>
   <p class="note saved-at" id="sAt"></p>
   <h3>Calendar</h3><p class="note">Exports deadlines only. In Google Calendar, create a calendar named Internships, then import this file into it so you can hide it anytime.</p>
   <div class="actions"><button class="btn" id="ics">Download deadlines (.ics)</button><span class="save-status" id="icsMsg" role="status" aria-live="polite"></span></div>
   <h3>Backup</h3><p class="note">Browser data disappears if site data is cleared. Back up weekly.</p>
   <div class="actions"><button class="btn" id="exp2">Download backup</button><button class="btn" id="imp">Restore from backup</button><span class="save-status" id="bkMsg" role="status" aria-live="polite"></span></div>`)) return;
  $("#sModel").value = st.model; if(!$("#sModel").value) $("#sModel").selectedIndex = 0;
  const FIELDS = ["sKey","sModel","sProfile","sResume","sPlanned","gP1","gP1By","gAll","gAllBy","sFu"];
  const form = trackForm(FIELDS.map(id => $("#" + id)), $("#sMsg"), () => { $("#sAt").textContent = savedAgo(st.savedAt); });

  // Reads storage back and compares every setting with the form. Never shows or logs the API key.
  const verify = () => {
    let saved;
    try{ const raw = localStorage.getItem(KEY); if(raw === null) return "nothing was stored"; saved = (JSON.parse(raw) || {}).settings || {}; }
    catch(e){ return "couldn't read it back"; }
    const sg = saved.goals || {};
    const want = [["API key", saved.apiKey, $("#sKey").value], ["model", saved.model, $("#sModel").value],
      ["About you", saved.profile, $("#sProfile").value], ["resume", saved.resume, $("#sResume").value],
      ["planned work", saved.planned, $("#sPlanned").value], ["follow-up days", saved.followDays, +$("#sFu").value],
      ["P1 goal", sg.p1, +$("#gP1").value], ["P1 date", sg.p1By, $("#gP1By").value],
      ["applications goal", sg.all, +$("#gAll").value], ["applications date", sg.allBy, $("#gAllBy").value],
      ["save time", saved.savedAt, st.savedAt]];
    const bad = want.find(([, a, b]) => a !== b);
    return bad ? `stored ${bad[0]} doesn't match` : null;
  };
  $("#sSave").onclick = async () => {
    const prevAt = st.savedAt; let snap;
    const ok = await runAction($("#sSave"), () => {
      Object.assign(st, {apiKey:$("#sKey").value.trim(), model:$("#sModel").value, profile:$("#sProfile").value, resume:$("#sResume").value, planned:$("#sPlanned").value,
        followDays:Math.min(365, Math.max(3, Math.round(+$("#sFu").value) || 14))});
      Object.assign(g, {p1:Math.min(200, Math.round(+$("#gP1").value) || 15), p1By:$("#gP1By").value, all:Math.min(200, Math.round(+$("#gAll").value) || 40), allBy:$("#gAllBy").value});
      // show the cleaned-up values, so the form matches what gets stored
      $("#sKey").value = st.apiKey; $("#sFu").value = st.followDays; $("#gP1").value = g.p1; $("#gAll").value = g.all;
      snap = form.read();
      st.savedAt = nowIso();
      persist();
    }, {verify, out:"#sMsg"});
    if(ok){ form.saved(snap); renderGoals(); render(); }
    else{ st.savedAt = prevAt; $("#sAt").textContent = savedAgo(st.savedAt); }
  };
  $("#ics").onclick = () => runAction($("#ics"), exportIcs, {busy:"Preparing…", ok:"Downloaded", fail:"", out:"#icsMsg", fade:3000});
  $("#exp2").onclick = () => runAction($("#exp2"), exportBackup, {busy:"Preparing…", ok:"Downloaded", fail:"", out:"#bkMsg", fade:3000});
  $("#imp").onclick = () => $("#importFile").click();
}
function download(name, text, type){ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
function exportBackup(){ const copy = JSON.parse(JSON.stringify(S)); copy.settings.apiKey = ""; download(`internship-backup-${today()}.json`, JSON.stringify(copy, null, 1), "application/json"); }
function exportIcs(){
  const ev = Object.values(S.items).filter(i => /^\d{4}-\d{2}-\d{2}$/.test(dueOf(i)) && i.status === "Saved").map(i => ({...i, deadline:dueOf(i)}));
  const text = s => String(s ?? "").replace(/[\\;,]/g, m => "\\" + m).replace(/\r\n|\r|\n/g, "\\n");  // RFC 5545 TEXT
  const line = s => String(s ?? "").replace(/[\r\n]+/g, "");
  if(!ev.length) throw new UserError("No saved roles have deadlines yet.");
  const d = s => s.replace(/-/g,""), stamp = new Date().toISOString().replace(/[-:]/g,"").slice(0,15) + "Z";
  const lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//s27dash//EN","X-WR-CALNAME:Internships"];
  ev.forEach(i => lines.push("BEGIN:VEVENT", `UID:${line(i.id)}@s27dash`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${d(i.deadline)}`, `DTEND;VALUE=DATE:${d(addDays(i.deadline,1))}`,
    `SUMMARY:Deadline: ${text(i.company + ", " + i.title)}`, safeUrl(i.url) ? `URL:${line(i.url)}` : "", "END:VEVENT"));
  lines.push("END:VCALENDAR");
  download("internship-deadlines.ics", lines.filter(Boolean).join("\r\n"), "text/calendar");
}
$("#importFile").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if(!f) return;
  const btn = $("#imp"); if(!btn) return;
  let before = null;
  const ok = await runAction(btn, async () => {
    let data;
    try{ data = JSON.parse(await f.text()); }catch(x){ throw new UserError("Restore failed: that file isn't valid JSON."); }
    if(!data || typeof data !== "object" || !data.items) throw new UserError("Restore failed: not a dashboard backup file.");
    before = S;
    const key = S.settings.apiKey; S = normalize(data); S.settings.apiKey = key || S.settings.apiKey;
    persist();
    return `Restored ${Object.keys(S.items).length} roles, ${S.contacts.length} contacts, ${Object.keys(S.analyses).length} matches`;
  }, {busy:"Restoring…", fail:"Restore failed: ", out:"#bkMsg", verify: () => storedMatches(s => s)});
  if(!ok){ if(before) S = before; return; }
  const msg = $("#bkMsg").textContent;
  renderGoals(); render(); resetDrawerHooks();  // the open Settings form is stale now
  reopenWith("#bkMsg", msg, openSettings);
};
$("#settingsBtn").onclick = openSettings;
$("#exportBtn").onclick = () => runAction($("#exportBtn"), exportBackup, {busy:"Preparing…", ok:"Downloaded", fail:"", out:"#hdrMsg", fade:3000});

boot();
</script>
